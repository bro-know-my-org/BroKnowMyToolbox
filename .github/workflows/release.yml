name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOOLBOX_DIR: BroKnowMyToolbox
  SPARK_DIR: BroKnowMySparkAnalyzer

jobs:
  validate:
    name: Release quality gates
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: BroKnowMyToolbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: BroKnowMyToolbox
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bro-know-my-org/BroKnowMySparkAnalyzer
          path: BroKnowMySparkAnalyzer

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: BroKnowMyToolbox/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Build the sibling Spark UI package
        working-directory: BroKnowMySparkAnalyzer
        run: pnpm install --frozen-lockfile && pnpm --filter @bro-know-my/spark-analyzer build
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches every workspace version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: pnpm run release:verify -- --tag "$RELEASE_TAG"
      - name: Resolve and verify the canonical tag revision
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          REVISION="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            runner: macos-15-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            runner: macos-15
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: BroKnowMyToolbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: BroKnowMyToolbox
          ref: ${{ needs.validate.outputs.revision }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bro-know-my-org/BroKnowMySparkAnalyzer
          path: BroKnowMySparkAnalyzer

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: BroKnowMyToolbox/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: BroKnowMyToolbox -> target
          key: release-${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb

      - name: Build the sibling Spark UI package
        working-directory: BroKnowMySparkAnalyzer
        run: pnpm install --frozen-lockfile && pnpm --filter @bro-know-my/spark-analyzer build
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked --release -p bkmt-cli --target ${{ matrix.target }}
      - run: pnpm tauri build --target ${{ matrix.target }}

      - name: Stage installers and portable files
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/stage-release.mjs \
            --target "${{ matrix.target }}" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --output release-stage

      - name: Smoke-test the staged CLI and desktop application
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/smoke-release.mjs \
            --root release-stage \
            --platform "${{ matrix.platform }}" \
            --version "$VERSION"

      - name: Preserve staged file modes for artifact transfer
        shell: bash
        run: tar -cf release-stage.tar -C release-stage .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: BroKnowMyToolbox/release-stage.tar
          if-no-files-found: error

  publish-draft:
    name: Assemble draft release
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: BroKnowMyToolbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: BroKnowMyToolbox
          ref: ${{ needs.validate.outputs.revision }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: downloaded-release

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Assemble checksums, manifest, and channel metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          while IFS= read -r -d '' archive; do
            tar -xf "$archive" -C "$(dirname "$archive")"
          done < <(find ../downloaded-release -name release-stage.tar -print0)
          node scripts/finalize-release-assets.mjs \
            --input ../downloaded-release \
            --output release-assets \
            --version "$VERSION" \
            --repository "${{ github.repository }}" \
            --revision "$(git rev-parse HEAD)"

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >/tmp/bkmt-release-draft 2>/dev/null; then
            test "$(cat /tmp/bkmt-release-draft)" = "true" || {
              echo "Refusing to overwrite published release $RELEASE_TAG" >&2
              exit 1
            }
            existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            while IFS= read -r asset; do
              test -z "$asset" || gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done <<< "$existing_assets"
          else
            gh release create "$RELEASE_TAG" --draft --generate-notes --title "Bro Know My Toolbox $RELEASE_TAG"
          fi
          find release-assets -maxdepth 1 -type f -print0 | \
            xargs -0 gh release upload "$RELEASE_TAG"
          find release-assets/channel -type f -print0 | \
            xargs -0 gh release upload "$RELEASE_TAG"
