[package]
name = "bkmt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for Bro Know My Toolbox"
publish = false

[[bin]]
name = "bkmt"
path = "src/main.rs"

[dependencies]
bkmsa-agent.workspace = true
bkmsa-core.workspace = true
clap.workspace = true
directories = "6"
file-generator.workspace = true
serde.workspace = true
serde_json.workspace = true
toolbox-core.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile.workspace = true
